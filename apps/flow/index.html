<title>몰입루틴</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* 레이아웃: 위 탭 3개(몰입·루틴·기록) + 한 열 카드, 실행 중에는 화면 전체를 덮는 타이머 */
:root{
  --bg:#EDF0F4; --paper:#FFFFFF; --ink:#18212E; --muted:#5E6878; --line:#D5DBE4;
  --acc:#2D5BD8; --acc-ink:#FFFFFF; --rest:#2E8A6B; --warn:#C2410C; --soft:#E3E9F7;
  --run-bg:#0F1724; --run-ink:#EAF0FA; --run-dim:#8A97AB; --run-track:#233046;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"Space Grotesk","IBM Plex Sans KR",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151D; --paper:#18202B; --ink:#E6EBF2; --muted:#93A0B3; --line:#2A3443;
  --acc:#7B9CFF; --acc-ink:#0D1320; --rest:#5CC49E; --warn:#F29B6B; --soft:#1F2A3D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151D; --paper:#18202B; --ink:#E6EBF2; --muted:#93A0B3; --line:#2A3443;
  --acc:#7B9CFF; --acc-ink:#0D1320; --rest:#5CC49E; --warn:#F29B6B; --soft:#1F2A3D; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-block:12px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header.top h1{margin:0;font-size:1.25rem;letter-spacing:-.02em;flex:1}
header.top .today{font-family:var(--f-num);color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
nav.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--paper);border:1px solid var(--line);margin-bottom:14px}
nav.tabs a{display:block;text-align:center;padding:9px 0;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:500}
nav.tabs a[aria-current="page"]{background:var(--acc);color:var(--acc-ink);font-weight:700}
section.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:1rem;margin:0 0 10px;letter-spacing:-.01em}
.lbl{font-size:.78rem;color:var(--muted);margin:12px 0 6px;letter-spacing:.02em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;min-height:38px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.chip.ghost{background:none;border-style:dashed;color:var(--muted)}
input[type=text],input[type=number],input[type=time],textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
input[type=number]{width:5.5em}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--acc);color:var(--acc-ink);min-height:46px}
.btn.big{width:100%;font-size:1.05rem;min-height:56px}
.btn.line{background:none;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.sm{padding:7px 12px;min-height:36px;font-size:.86rem;border-radius:10px}
.btn.danger{background:none;border:1px solid var(--warn);color:var(--warn)}
.hint{color:var(--muted);font-size:.82rem;margin:6px 0 0}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:.9rem}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.sum b{font-family:var(--f-num);font-size:1.6rem;font-variant-numeric:tabular-nums}
.sum small{color:var(--muted)}
/* 루틴 목록 */
.rt{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.rt:first-of-type{border-top:0}
.rt .nm{flex:1;min-width:0}
.rt .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt .nm small{color:var(--muted);font-size:.8rem}
.play{width:46px;height:46px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);font-size:1.05rem;flex:none}
.iconb{border:1px solid var(--line);background:none;border-radius:10px;min-width:38px;min-height:38px;color:var(--muted)}
/* 루틴 편집 */
.it{display:grid;grid-template-columns:1fr 4.6em auto auto auto;gap:6px;align-items:center;margin-bottom:6px}
.it input[type=number]{width:100%}
.kind{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:42px;padding:0 8px;font-size:.8rem}
.kind.b{color:var(--rest);border-color:var(--rest)}
.days{display:flex;gap:4px}
.days button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:.82rem}
.days button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
/* 기록 */
.bars{width:100%;height:auto;display:block}
.log li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.log{list-style:none;margin:0;padding:0}
.log li:first-child{border-top:0}
.log .t{font-family:var(--f-num);color:var(--muted);font-size:.82rem;flex:none;width:7.6em;font-variant-numeric:tabular-nums;white-space:nowrap}
.log .w{flex:1;min-width:0}
.log .w small{color:var(--muted)}
.log .m{font-family:var(--f-num);font-variant-numeric:tabular-nums;flex:none}
.stars{color:var(--acc);letter-spacing:1px}
.find li{margin:5px 0}
.find{padding-left:18px;margin:0}
/* 알림 띠 */
.alarm{position:fixed;left:0;right:0;top:0;z-index:30;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--acc);color:var(--acc-ink);display:flex;gap:10px;align-items:center}
.alarm span{flex:1}
.alarm button{border:1px solid currentColor;background:none;color:inherit;border-radius:10px;padding:6px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:40;max-width:90vw}
/* 실행 화면 */
.run{position:fixed;inset:0;z-index:20;background:var(--run-bg);color:var(--run-ink);display:flex;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.run.rest{--run-acc:var(--rest)}
.run{--run-acc:#7B9CFF}
.run .phase{font-size:.82rem;letter-spacing:.08em;color:var(--run-dim);margin-top:6px}
.run .task{font-size:1.25rem;font-weight:700;text-align:center;margin:6px 0 0;max-width:30ch;text-wrap:balance}
.ringbox{position:relative;width:min(78vw,320px);aspect-ratio:1;max-width:100%;margin:22px 0 14px}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox .tm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringbox .tm b{font-family:var(--f-num);font-size:clamp(3rem,15vw,4.4rem);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.ringbox .tm small{color:var(--run-dim);font-size:.85rem}
.segs{display:flex;gap:4px;width:min(90vw,360px);margin-bottom:16px}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--run-track)}
.segs i.done{background:var(--run-dim)}
.segs i.now{background:var(--run-acc)}
.segs i.b{opacity:.55}
.next{color:var(--run-dim);font-size:.88rem;min-height:1.4em;text-align:center}
.ctl{display:flex;gap:14px;align-items:center;margin-top:18px}
.ctl button{border:0;border-radius:50%;width:60px;height:60px;background:var(--run-track);color:var(--run-ink);font-size:1.2rem}
.ctl button.main{width:78px;height:78px;background:var(--run-acc);color:#0D1320;font-size:1.5rem}
.runbar{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;justify-content:center}
.runbar button{border:1px solid var(--run-track);background:none;color:var(--run-dim);border-radius:999px;padding:7px 14px;font-size:.84rem;min-height:38px}
.runbar button[aria-pressed="true"]{color:var(--run-ink);border-color:var(--run-acc)}
.rate{width:min(92vw,420px);margin-top:10px;text-align:center}
.rate h2{font-size:1.3rem;margin:14px 0 4px}
.rate .big{font-family:var(--f-num);font-size:2.6rem;font-weight:700;margin:4px 0}
.rate .st{display:flex;gap:8px;justify-content:center;margin:14px 0}
.rate .st button{width:52px;height:52px;border-radius:14px;border:1px solid var(--run-track);background:none;color:var(--run-ink);font-family:var(--f-num);font-size:1.15rem}
.rate .st button[aria-pressed="true"]{background:var(--run-acc);color:#0D1320;border-color:var(--run-acc)}
.rate input{background:var(--run-track);border-color:var(--run-track);color:var(--run-ink)}
.rate .row{justify-content:center;margin-top:14px}
.rate .btn.line{color:var(--run-ink);border-color:var(--run-track)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top"><h1>몰입루틴</h1><span class="today" id="today"></span></header>
  <nav class="tabs" aria-label="화면">
    <a href="#focus" id="t-focus">🎯 몰입</a>
    <a href="#routine" id="t-routine">🔁 루틴</a>
    <a href="#log" id="t-log">📊 기록</a>
  </nav>
  <main id="view"></main>
</div>
<div class="alarm" id="alarm" hidden></div>
<div class="run" id="run" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(()=>{
'use strict';
/* ---------- 저장 ---------- */
const KEY='flowroutine.v1';
const DEF={routines:[
  {id:'r1',name:'아침 루틴',items:[{n:'물 한 잔·환기',m:2,k:'b'},{n:'기도·묵상',m:10,k:'f'},{n:'스트레칭',m:5,k:'b'},{n:'오늘 할 일 정리',m:5,k:'f'}],alarm:{on:false,time:'06:30',days:[1,2,3,4,5]}},
  {id:'r2',name:'업무 시작',items:[{n:'책상 정리',m:2,k:'b'},{n:'가장 중요한 일',m:45,k:'f'},{n:'쉬기',m:5,k:'b'},{n:'메일·메시지 확인',m:10,k:'f'}],alarm:{on:false,time:'09:00',days:[1,2,3,4,5]}},
  {id:'r3',name:'잠들기 전',items:[{n:'내일 준비',m:5,k:'f'},{n:'하루 돌아보기',m:5,k:'f'},{n:'독서',m:15,k:'f'}],alarm:{on:false,time:'22:30',days:[0,1,2,3,4,5,6]}}
],logs:[],set:{min:25,brk:5,rounds:1,acts:[],sound:'',beep:true}};
let S;
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');S=o&&o.routines?o:JSON.parse(JSON.stringify(DEF))}catch(e){S=JSON.parse(JSON.stringify(DEF))}S.set=Object.assign({},DEF.set,S.set||{});S.logs=S.logs||[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();

/* ---------- 도구 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dk=d=>{d=d||new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const hm=t=>{const d=new Date(t);return`${pad(d.getHours())}:${pad(d.getMinutes())}`};
const mmss=ms=>{ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return s>=3600?`${Math.floor(s/3600)}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`:`${pad(Math.floor(s/60))}:${pad(s%60)}`};
const fmtMin=m=>{m=Math.round(m);return m>=60?`${Math.floor(m/60)}시간${m%60?' '+m%60+'분':''}`:`${m}분`};
const WD='일월화수목금토';
let tT=null;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,2600)}
$('#today').textContent=(()=>{const d=new Date();return`${d.getMonth()+1}.${d.getDate()} ${WD[d.getDay()]}`})();

/* ---------- 소리 ---------- */
let AC=null,noise=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function beep(n=3){if(!S.set.beep)return;const a=ac();if(!a)return;for(let i=0;i<n;i++){const o=a.createOscillator(),g=a.createGain();o.frequency.value=i%2?660:880;o.connect(g);g.connect(a.destination);const t=a.currentTime+i*.32;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.start(t);o.stop(t+.27)}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function soundSet(kind){S.set.sound=kind;save();if(noise){try{noise.src.stop()}catch(e){}noise=null}if(!kind)return;const a=ac();if(!a)return;
  const len=a.sampleRate*4,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);let last=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;if(kind==='brown'){last=(last+.02*w)/1.02;d[i]=last*3.2}else if(kind==='rain'){last=(last+.12*w)/1.12;d[i]=last*1.6+(Math.random()<.0008?w*.8:0)}else d[i]=w*.35}
  const src=a.createBufferSource();src.buffer=buf;src.loop=true;const g=a.createGain();g.gain.value=kind==='white'?.18:.5;let node=src;
  if(kind==='rain'){const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=2400;src.connect(f);node=f}
  node.connect(g);g.connect(a.destination);src.start();noise={src}}

/* ---------- 화면 켜짐 ---------- */
let WL=null;async function wake(on){try{if(on&&!WL&&navigator.wakeLock){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>WL=null)}else if(!on&&WL){await WL.release();WL=null}}catch(e){WL=null}}

/* ---------- 실행 엔진 ---------- */
const RK='flowroutine.run';
let RUN=null,tick=null;
function runSave(){try{RUN?localStorage.setItem(RK,JSON.stringify(RUN)):localStorage.removeItem(RK)}catch(e){}}
function segLeft(){const s=RUN.segs[RUN.i];const now=RUN.paused?RUN.pausedAt:Date.now();return s.m*60000-(now-RUN.segStart-RUN.pz)}
function startRun(o){ac();RUN=Object.assign({i:0,segStart:Date.now(),pz:0,paused:false,pausedAt:0,startedAt:Date.now(),done:[]},o);runSave();wake(true);if(S.set.sound)soundSet(S.set.sound);openRun()}
function focusSegs(act,min,brk,rounds){const L=[];for(let r=0;r<rounds;r++){L.push({n:act||'몰입',m:min,k:'f'});if(brk>0&&r<rounds-1)L.push({n:'쉬는 시간',m:brk,k:'b'})}return L}
function segEnd(skipped){const s=RUN.segs[RUN.i];const now=RUN.paused?RUN.pausedAt:Date.now();const used=Math.min(s.m*60000,Math.max(0,now-RUN.segStart-RUN.pz));RUN.done.push({n:s.n,k:s.k,pm:s.m,am:used/60000,skip:!!skipped});
  if(RUN.i>=RUN.segs.length-1){finishRun();return}RUN.i++;RUN.segStart=Date.now();RUN.pz=0;RUN.paused=false;runSave();if(!skipped)beep(RUN.segs[RUN.i-1].k==='f'?3:2);drawRun()}
function finishRun(){clearInterval(tick);tick=null;RUN.ended=Date.now();RUN.rating=true;runSave();beep(4);wake(false);soundSet('');S.set.sound=S.set.sound;drawRun()}
function openRun(){$('#run').hidden=false;document.body.style.overflow='hidden';drawRun();clearInterval(tick);if(!RUN.rating)tick=setInterval(onTick,250)}
function closeRun(){$('#run').hidden=true;document.body.style.overflow='';clearInterval(tick);tick=null;RUN=null;runSave();wake(false);if(noise){try{noise.src.stop()}catch(e){}noise=null}render()}
function onTick(){if(!RUN||RUN.rating)return;if(!RUN.paused&&segLeft()<=0){segEnd(false);return}const b=$('#run .tm b');if(b)b.textContent=mmss(segLeft());const c=$('#ringfg');if(c){const s=RUN.segs[RUN.i];const p=1-segLeft()/(s.m*60000);c.style.strokeDashoffset=String(CIRC*(1-Math.min(1,Math.max(0,p))))}document.title=`${mmss(segLeft())} · ${RUN.segs[RUN.i].n}`}
const CIRC=2*Math.PI*46;
function drawRun(){const R=$('#run');if(!RUN){R.hidden=true;return}
  if(RUN.rating){const f=RUN.done.filter(x=>x.k==='f');const am=f.reduce((a,x)=>a+x.am,0),pm=f.reduce((a,x)=>a+x.pm,0);R.className='run';
    R.innerHTML=`<div class="rate"><div class="phase">${RUN.kind==='routine'?'루틴 끝':'몰입 끝'}</div><h2>${esc(RUN.name)}</h2><div class="big">${fmtMin(am)}</div><div class="phase">계획 ${fmtMin(pm)} · ${hm(RUN.startedAt)}~${hm(RUN.ended)}</div>
    <p class="phase" style="margin-top:22px">얼마나 집중했나요?</p><div class="st" role="group" aria-label="집중도">${[1,2,3,4,5].map(v=>`<button type="button" data-rv="${v}" aria-pressed="${RUN.fq===v}">${v}</button>`).join('')}</div>
    <input type="text" id="rmemo" placeholder="한 줄 메모 (방해 요인, 잘된 점)" value="${esc(RUN.memo||'')}" autocomplete="off">
    <div class="row"><button type="button" class="btn line" data-r="discard">기록 안 함</button><button type="button" class="btn" data-r="save">기록 저장</button></div></div>`;document.title='몰입루틴';return}
  const s=RUN.segs[RUN.i],nx=RUN.segs[RUN.i+1];R.className='run'+(s.k==='b'?' rest':'');const fN=RUN.segs.filter(x=>x.k==='f').length,fI=RUN.segs.slice(0,RUN.i+1).filter(x=>x.k==='f').length;
  R.innerHTML=`<div class="phase">${s.k==='b'?'쉬는 시간':(RUN.kind==='routine'?esc(RUN.name)+' · ':'')+'몰입 '+fI+'/'+fN}</div><div class="task">${esc(s.n)}</div>
   <div class="ringbox"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="var(--run-track)" stroke-width="4"/><circle id="ringfg" cx="50" cy="50" r="46" fill="none" stroke="var(--run-acc)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"/></svg>
   <div class="tm"><b>${mmss(segLeft())}</b><small>${RUN.paused?'멈춤':s.m+'분 중'}</small></div></div>
   <div class="segs">${RUN.segs.map((x,i)=>`<i class="${i<RUN.i?'done':i===RUN.i?'now':''} ${x.k}"></i>`).join('')}</div>
   <div class="next">${nx?`다음 · ${esc(nx.n)} ${nx.m}분`:'마지막 구간'}</div>
   <div class="ctl"><button type="button" data-r="end" aria-label="끝내기">■</button><button type="button" class="main" data-r="pause" aria-label="${RUN.paused?'다시 시작':'멈추기'}">${RUN.paused?'▶':'❚❚'}</button><button type="button" data-r="skip" aria-label="다음 구간">⏭</button></div>
   <div class="runbar" role="group" aria-label="집중 소리">${[['','소리 없음'],['rain','빗소리'],['brown','낮은 소음'],['white','백색 소음']].map(([k,l])=>`<button type="button" data-snd="${k}" aria-pressed="${(S.set.sound||'')===k}">${l}</button>`).join('')}</div>
   <div class="runbar"><button type="button" data-r="add5">＋5분</button><button type="button" data-r="min">작게 보기</button></div>`;onTick()}

  const hb={};L.filter(l=>l.fq).forEach(l=>{const h=Math.floor(new Date(l.start).getHours()/2)*2;(hb[h]=hb[h]||[]).push(l.fq)});const H=Object.entries(hb).filter(([,v])=>v.length>=2).map(([h,v])=>({h:+h,v:v.reduce((a,b)=>a+b,0)/v.length})).sort((a,b)=>b.v-a.v);

function showIO(t){$('#io').innerHTML=`<textarea rows="5" readonly style="margin-top:10px">${esc(t)}</textarea><p class="hint">복사가 막혀 있어 아래 내용을 직접 길게 눌러 복사하십시오.</p>`}
function keepAct(){const i=$('#act');if(i)S.set.lastAct=i.value}
function readEdit(){if(!EDIT)return;const n=$('#rn');if(n)EDIT.name=n.value;document.querySelectorAll('[data-in]').forEach(i=>EDIT.items[+i.dataset.in].n=i.value);document.querySelectorAll('[data-im]').forEach(i=>EDIT.items[+i.dataset.im].m=Math.max(1,Math.min(240,+i.value||1)));const on=$('#aon');if(on)EDIT.alarm.on=on.checked;const t=$('#atime');if(t&&t.value)EDIT.alarm.time=t.value}

/* ---------- 시작 ---------- */
try{const r=JSON.parse(localStorage.getItem(RK)||'null');if(r&&r.segs){RUN=r;if(!RUN.rating){/* 꺼져 있던 동안 지난 구간 정리 */let g=0;while(!RUN.paused&&segLeft()<=0&&g++<50){const s=RUN.segs[RUN.i];RUN.done.push({n:s.n,k:s.k,pm:s.m,am:s.m,skip:false});if(RUN.i>=RUN.segs.length-1){RUN.ended=RUN.segStart+RUN.pz+s.m*60000;RUN.rating=true;break}RUN.segStart=RUN.segStart+RUN.pz+s.m*60000;RUN.pz=0;RUN.i++}}runSave();openRun()}}catch(e){RUN=null}
route();
})();
</script>
