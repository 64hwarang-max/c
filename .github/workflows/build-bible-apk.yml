name: 말씀과 기도 APK 만들기
on:
  push:
    paths:
      - 'bible-app/**'
      - 'compat.js'
      - '.github/workflows/build-bible-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 파일 확인
        run: test -f bible-app/index.html || (echo "bible-app/index.html 이 없습니다." && exit 1)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 프로젝트 준비
        run: |
          mkdir -p www && cp bible-app/index.html www/index.html && cp bible-text.txt bible-meta.txt www/
          sed -i "s/__BUILD__/#${GITHUB_RUN_NUMBER} $(TZ=Asia/Seoul date +%m.%d_%H:%M)/" www/index.html
          # 구형 안드로이드(낡은 웹뷰)에서도 열리도록 문법을 낮추고 빠진 기능을 채움 (실패해도 원본 그대로 진행)
          mkdir -p /tmp/eb && (cd /tmp/eb && npm init -y >/dev/null 2>&1 && npm i esbuild@0.21.5 >/dev/null 2>&1) || echo "esbuild 설치 실패 - 기능 채우기만 적용"
          cp www/index.html /tmp/index.orig.html
          NODE_PATH=/tmp/eb/node_modules node compat.js www/index.html || cp /tmp/index.orig.html www/index.html
          cat > package.json <<'J'
          {"name":"bible-prayer","version":"1.0.0","private":true,
           "dependencies":{"@capacitor/android":"^7.0.0","@capacitor/app":"^7.0.0","@capacitor/core":"^7.0.0","@capacitor/filesystem":"^7.0.0","@capacitor/share":"^7.0.0"},
           "devDependencies":{"@capacitor/cli":"^7.0.0"}}
          J
          cat > capacitor.config.json <<'J'
          {"appId":"kr.growthjournal.bible","appName":"말씀과 기도","webDir":"www"}
          J
          npm install
          npx cap add android
          npx cap sync android
      - name: 앱 아이콘
        run: |
          R=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p $R/mipmap-$d && cp bible-app/icons/mipmap-$d/*.png $R/mipmap-$d/; done
          mkdir -p $R/values && printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#1E3A8A</color>\n</resources>\n' > $R/values/ic_launcher_background.xml
      - name: 서명 키 고정
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
          cp ~/.android/debug.keystore android/fixed.keystore
          cat > sign-fix.js <<'SGN'
          const fs=require('fs');
          const blk='\n    signingConfigs { debug { storeFile rootProject.file("fixed.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } } // FIXED-SIGN\n';
          const f='android/app/build.gradle';let g=fs.readFileSync(f,'utf8');
          if(!g.includes('FIXED-SIGN')){g=g.replace(/android\s*\{/,m=>m+blk);fs.writeFileSync(f,g)}
          console.log(g.includes('FIXED-SIGN')?'서명 키 고정 OK':'FAIL');
          SGN
          node sign-fix.js
          VC=$(( $(date +%s) / 60 - 29000000 )); sed -i -E "s/versionCode [0-9]+/versionCode ${VC}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
      - name: APK 빌드
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --console=plain
      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: bible-prayer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
